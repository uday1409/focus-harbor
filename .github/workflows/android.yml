name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check, inspect, and export APK
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Upload evaluation APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focus-harbor-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  emulator:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable the ephemeral runner's emulator accelerator
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android acceptance tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-audio -no-boot-anim -no-snapshot -no-metrics
          script: >-
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest ||
            { status=$?; mkdir -p app/build/reports/emulator-diagnostics;
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell dumpsys window
            > app/build/reports/emulator-diagnostics/window.txt;
            "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d -b events
            > app/build/reports/emulator-diagnostics/events.log;
            exit "$status"; }
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/emulator-diagnostics/
          retention-days: 14
